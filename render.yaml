# Blueprint do Render: https://dashboard.render.com/blueprints -> New Blueprint Instance
services:
  - type: web
    name: nutribot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MODELOS_RESERVA
        value: gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-3-flash-preview
      - key: GEMINI_MODELOS_LEVES
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite
      - key: MANTER_COLCHETES_NO_ZAP
        value: "false"
      - key: KEEPALIVE_MINUTES
        value: "10"
      - key: LOG_LEVEL
        value: warn
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: ADMIN_JID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_GROUP_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: HF_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
