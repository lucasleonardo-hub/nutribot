# Blueprint do Render: https://dashboard.render.com/blueprints -> New Blueprint Instance
services:
  - type: web
    name: nutribot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MANTER_COLCHETES_NO_ZAP
        value: "false"
      - key: KEEPALIVE_MINUTES
        value: "10"
      - key: LOG_LEVEL
        value: warn
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_GROUP_ID
        sync: false
