# Camada 2 do anti-sleep: o GitHub bate em /ping a cada 5 min (grátis em repositório público).
# Cobre os momentos em que o processo do Render está reiniciando e o auto-ping interno não roda.
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping /ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://nutribot-5gwk.onrender.com/ping || true)
          echo "HTTP $code"
          test "$code" = "200"
